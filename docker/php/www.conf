[www]
; Rodamos o container como www-data (USER no Dockerfile); as diretivas user/group ficam sem efeito.
listen = 9000
; Variáveis do container (DB_DSN, APP_ENCRYPTION_KEY…) precisam chegar ao getenv() do PHP.
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500
; Usado apenas pelo healthcheck interno (a porta 9000 não é publicada).
ping.path = /ping
ping.response = pong
