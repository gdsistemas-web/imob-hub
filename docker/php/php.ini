; Produção: nada de erros na resposta HTTP; tudo vai para o log do container.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
expose_php = Off

; Uploads: fotos e documentos até UPLOAD_MAX_BYTES (10 MB por padrão) + folga do multipart.
upload_max_filesize = 12M
post_max_size = 14M
max_file_uploads = 20

; O processamento de fotos eleva o limite para 512M sob demanda (PropertyService).
memory_limit = 256M
max_execution_time = 60

session.use_strict_mode = 1
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
