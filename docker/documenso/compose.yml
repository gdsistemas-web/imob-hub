# Documenso (assinatura eletrônica) para desenvolvimento local.
# Uso: cp .env.example .env && ./gerar-certificado.sh && docker compose up -d
# Documenso: http://localhost:3000   ·   E-mails capturados (Mailpit): http://localhost:8025
# Baseado em https://github.com/documenso/documenso/blob/main/docker/production/compose.yml (AGPL-3.0; usado sem modificações).
name: imob-hub-documenso

services:
  database:
    image: postgres:15
    environment:
      POSTGRES_USER: documenso
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env}
      POSTGRES_DB: documenso
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U documenso -d documenso']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes: [database:/var/lib/postgresql/data]

  mailpit:
    image: axllent/mailpit:latest
    ports: ['8025:8025']

  documenso:
    image: documenso/documenso:latest
    depends_on:
      database: {condition: service_healthy}
    environment:
      PORT: 3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?defina no .env}
      NEXT_PRIVATE_ENCRYPTION_KEY: ${NEXT_PRIVATE_ENCRYPTION_KEY:?defina no .env}
      NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY: ${NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY:?defina no .env}
      NEXT_PUBLIC_WEBAPP_URL: ${NEXT_PUBLIC_WEBAPP_URL:-http://localhost:3000}
      NEXT_PRIVATE_INTERNAL_WEBAPP_URL: http://localhost:3000
      NEXT_PRIVATE_DATABASE_URL: postgres://documenso:${POSTGRES_PASSWORD}@database:5432/documenso
      NEXT_PRIVATE_DIRECT_DATABASE_URL: postgres://documenso:${POSTGRES_PASSWORD}@database:5432/documenso
      NEXT_PUBLIC_UPLOAD_TRANSPORT: database
      NEXT_PRIVATE_SMTP_TRANSPORT: smtp-auth
      NEXT_PRIVATE_SMTP_HOST: ${SMTP_HOST:-mailpit}
      NEXT_PRIVATE_SMTP_PORT: ${SMTP_PORT:-1025}
      NEXT_PRIVATE_SMTP_USERNAME: ${SMTP_USERNAME:-}
      NEXT_PRIVATE_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      NEXT_PRIVATE_SMTP_SECURE: ${SMTP_SECURE:-false}
      NEXT_PRIVATE_SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Contratos}
      NEXT_PRIVATE_SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-contratos@imobiliaria.local}
      NEXT_PUBLIC_DISABLE_SIGNUP: ${NEXT_PUBLIC_DISABLE_SIGNUP:-false}
      NEXT_PRIVATE_SIGNING_LOCAL_FILE_PATH: /opt/documenso/cert.p12
      NEXT_PRIVATE_SIGNING_PASSPHRASE: ${SIGNING_PASSPHRASE:-}
    ports: ['3000:3000']
    extra_hosts: ['host.docker.internal:host-gateway']  # para o webhook alcançar a API do IMOB HUB na máquina
    volumes: ['./cert.p12:/opt/documenso/cert.p12:ro']

volumes:
  database:
