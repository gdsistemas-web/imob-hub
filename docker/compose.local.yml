# Somente para testar a stack de produção na sua máquina (NÃO usar no Coolify, que publica o "web" pelo proxy dele).
#   docker compose -f compose.coolify.yml -f docker/compose.local.yml --env-file docker/coolify.env up -d --build
# Publica o Nginx em 127.0.0.1 apenas; MySQL e PHP-FPM continuam sem porta no host.
services:
  web:
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:8080"
