# IMOB HUB — único serviço exposto. Atende:
#   /            → build do React (SPA, com fallback para index.html)
#   /api/*       → PHP-FPM (backend/public/index.php, que faz todo o roteamento da API a partir de REQUEST_URI)
#   /uploads/*   → fotos públicas dos imóveis (volume compartilhado com o PHP, somente leitura aqui)
# Nada mais do backend é acessível: o Nginx não tem o código PHP e só entrega ao FPM o index.php.

# IP real do visitante (o rate limit da API usa REMOTE_ADDR). Confia no X-Forwarded-For apenas quando a conexão
# chega de redes privadas — o proxy do Coolify (Traefik/Caddy) fica na rede Docker.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # Fotos/documentos até 10 MB (UPLOAD_MAX_BYTES) + folga do multipart.
    client_max_body_size 14m;

    # DNS interno do Docker: reavalia o IP do serviço php se o container for recriado.
    resolver 127.0.0.11 valid=10s ipv6=off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # API: todas as rotas vão para o front controller existente.
    location ^~ /api/ {
        set $php_upstream php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/backend/public;
        fastcgi_param HTTPS $fastcgi_https if_not_empty;
        fastcgi_pass $php_upstream;
        fastcgi_read_timeout 90s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Fotos dos imóveis: somente imagens, nunca executa nada.
    location ^~ /uploads/ {
        root /srv;
        location ~* \.(jpe?g|png|webp)$ {
            expires 30d;
            add_header Cache-Control "public" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }
        return 404;
    }

    # Arquivos do build com hash no nome: cache longo.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Service worker e manifesto do PWA precisam ser revalidados a cada visita.
    location = /sw.js { add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options "nosniff" always; try_files $uri =404; }
    location = /manifest.webmanifest { default_type application/manifest+json; add_header Cache-Control "no-cache" always; try_files $uri =404; }

    # Arquivos ocultos (.env, .git…) nunca.
    location ~ /\. { deny all; return 404; }

    # SPA: qualquer outra rota (/, /imovel/:id, /painel, /login…) cai no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }
}

# Coolify termina o HTTPS no proxy; repassa o esquema original para o PHP.
map $http_x_forwarded_proto $fastcgi_https {
    default "";
    https on;
}
